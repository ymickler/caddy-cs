name: build
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  schedule:
    # weekly rebuild: picks up security patches of the base image (same Caddy tag, new digest)
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ymickler/caddy-cs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read versions from Dockerfile
        id: v
        run: |
          echo "caddy=$(grep -m1 -oP '^FROM caddy:\K[0-9.]+(?=-builder)' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "bouncer=$(grep -m1 -oP '^ARG BOUNCER_VERSION=\K\S+' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: caddy-cs:test
      - name: Smoke test
        run: |
          docker run --rm caddy-cs:test caddy version
          docker run --rm caddy-cs:test caddy list-modules | grep -E '^(crowdsec|http.handlers.crowdsec)$'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.caddy }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.caddy }}-cs${{ steps.v.outputs.bouncer }}
            ${{ env.IMAGE }}:latest
